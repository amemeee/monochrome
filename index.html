<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Black-and-white clothing, picked without small talk.">
  <title>Monochrome</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="nav">
    <a class="brand" id="brand" href="#hero">Monochrome</a>
    <div class="nav-links">
      <a class="nav-link" href="#order">Shop</a>
      <a class="nav-link" href="#track">Track</a>
      <a class="nav-link nav-me" id="navMe" href="#me" data-locked="true">Orders <span class="lock-slot"></span></a>
      <a class="nav-order" id="navBag" href="#bag" aria-label="Bag, empty">
        <svg class="bag-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l1 13H4Z"/><path d="M8.5 8V6.5a3.5 3.5 0 0 1 7 0V8" fill="none"/></svg>
        <span class="bag-count" id="bagCount" aria-hidden="true" hidden>0</span>
      </a>
    </div>
  </nav>

  <!-- ── Section 1: Mio runs the shop ── -->
  <section class="hero" id="hero" aria-label="Mio and Ren, the shopkeepers">
    <!-- Ren: desktop only, stands beside Mio and chimes in -->
    <div class="ren-figure" id="renFigure">
      <button class="ren" id="ren" type="button" aria-label="Poke Ren">
        <img class="ren-img" id="renImg" alt="" decoding="async">
        <img class="ren-blink" id="renBlink" alt="" decoding="async">
      </button>
      <p class="ren-bubble" id="renBubble" aria-hidden="true"></p>
      <p class="sr-only" id="renLive" aria-live="polite"></p>
    </div>

    <div class="mio-figure" id="mioFigure">
      <button class="mio" id="mio" type="button" aria-label="Poke Mio">
        <img class="mio-img" id="mioImg" alt="" decoding="async">
        <img class="mio-blink" id="mioBlink" alt="" decoding="async">
      </button>

      <div class="bubble" id="bubble">
        <p class="bubble-text" id="bubbleText" aria-hidden="true"></p>
        <p class="sr-only" id="bubbleLive" aria-live="polite"></p>
        <div class="bubble-choices" id="choices" role="group" aria-label="Reply to Mio"></div>
      </div>
    </div>

    <button class="talk-btn" id="talkBtn" type="button" hidden>Talk to Mio</button>
    <a class="scroll-cue" href="#order">scroll to shop <span aria-hidden="true">↓</span></a>
  </section>

  <!-- ── Section 2: the catalogue ── -->
  <section class="order" id="order" aria-labelledby="orderTitle">
    <header class="order-head">
      <h2 id="orderTitle">Shop</h2>
      <p>Black, white and grey. Nobody will ask “can I help you?”</p>
    </header>

    <div class="shop-bar">
      <div class="tabs" id="tabs" role="group" aria-label="Category"></div>
      <div class="bar-right">
        <div class="worn" role="group" aria-label="Worn by"><span>Worn by</span><span id="worn"></span></div>
        <label class="sort">Sort
          <select id="sort">
            <option value="featured">Featured</option>
            <option value="low">Price: low to high</option>
            <option value="high">Price: high to low</option>
          </select>
        </label>
      </div>
    </div>

    <div class="order-grid">
      <div>
        <p class="count" id="count"></p>
        <div class="products" id="products"></div>
        <nav class="pager" id="pager" aria-label="Pages"></nav>
      </div>

      <aside class="summary-wrap" id="bag">
        <!-- Mio peeking over the bag card (shows once assets/mio/peek.jpg exists) -->
        <div class="peek" id="peek" aria-hidden="true">
          <div class="peek-clip"><img class="peek-img" id="peekImg" alt="" decoding="async"></div>
          <p class="peek-bubble" id="peekBubble"></p>
        </div>
        <div class="summary" id="summary" aria-live="polite"></div>
      </aside>
    </div>
  </section>

  <!-- ── Section 3: track your parcel ── -->
  <section class="track-band" id="track" aria-labelledby="trackTitle">
   <div class="order track">
    <header class="order-head">
      <h2 id="trackTitle">Track</h2>
      <p>Enter the code from your receipt to see where your parcel is.</p>
    </header>
    <div class="track-grid">
      <div class="track-main">
        <form class="track-form" id="trackForm">
          <label>Tracking code
            <input id="trackCode" name="code" required maxlength="20" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. 1311-K7QP">
          </label>
          <button type="submit" class="btn main">Track</button>
        </form>
        <div class="track-recent" id="trackRecent"></div>
        <div class="track-result" id="trackResult" aria-live="polite"></div>
      </div>
      <!-- Ren the courier, to the right of the card (assets/ren/courier.jpg); he comments on the status -->
      <div class="track-ren-wrap">
        <p class="track-bubble" id="trackBubble">…got a code? give it here. I'll find your parcel.</p>
        <img class="track-ren" id="trackRen" src="assets/ren/courier.jpg" alt="Ren in a courier uniform, carrying a parcel" decoding="async" loading="lazy">
      </div>
    </div>
   </div>
  </section>

  <!-- ── Section 4: your orders (locked until you've ordered) ── -->
  <section class="me" id="me" aria-labelledby="meTitle">
    <div class="order me-inner">
      <header class="order-head">
        <h2 id="meTitle">My orders</h2>
        <p>Orders placed on this device, with receipts.</p>
      </header>
      <div class="me-grid">
        <!-- Mio on the left (assets/mio/thanks.jpg), the orders on the right -->
        <img class="me-mio" src="assets/mio/thanks.jpg" alt="Mio making a heart with her hands" decoding="async" loading="lazy">
        <div id="meBody"></div>
      </div>
    </div>
  </section>

  <!-- Quick view: filled in by app.js -->
  <dialog class="quick" id="quick" aria-labelledby="qvTitle"></dialog>

  <!-- Receipt: opens when an order is complete; filled in by app.js -->
  <dialog class="quick receipt" id="receipt" aria-labelledby="rcTitle"></dialog>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="hero.js"></script>
</body>
</html>
